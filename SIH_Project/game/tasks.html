<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Tasks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #FDF3E3;
    color: #2E2A1F;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px;
  }
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .back {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid #EFE3CC;
    background: #FFFDF9;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top h1 { font-size: 20px; font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 12px; }

  .game-card {
    background: #FFFDF9;
    border: 1px solid #EFE3CC;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .game-card.locked { opacity: 0.55; cursor: default; }
  .game-card:active:not(.locked) { transform: scale(0.98); }

  .num {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #E3EBD8;
    color: #4F7A3B;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .game-card.locked .num { background: #EFE3CC; color: #6B6455; }
  .game-card.done .num { background: #4F7A3B; color: #fff; }

  .game-body { flex: 1; min-width: 0; }
  .game-title { font-size: 16px; font-weight: 700; }
  .game-sub { font-size: 13px; color: #6B6455; margin-top: 2px; }

  .status {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 20px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .status.ready { background: #4F7A3B; color: #fff; }
  .status.done { background: #E3EBD8; color: #3F5F30; }
  .status.locked { background: #EFE3CC; color: #6B6455; }
</style>
</head>
<body>

<div class="top">
  <button class="back" onclick="window.location.href='index.html'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2A1F" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1>Your Daily Task</h1>
</div>

<div class="list" id="gameList"></div>

<script>
  const games = [
    { id: 1, title: 'My People, My Memory', sub: 'Match the name to the face', href: 'game1.html', available: true },
    { id: 2, title: 'Number Match',          sub: 'Coming soon',                href: null,        available: false },
    { id: 3, title: 'Word Recall',            sub: 'Coming soon',                href: null,        available: false },
    { id: 4, title: 'Picture Puzzle',         sub: 'Coming soon',                href: null,        available: false },
    { id: 5, title: 'Daily Routine Quiz',     sub: 'Coming soon',                href: null,        available: false },
  ];

  function getGamesCompleted() {
    return parseInt(localStorage.getItem('gamesCompleted') || '0', 10);
  }

  function render() {
    const completed = getGamesCompleted();
    const list = document.getElementById('gameList');
    list.innerHTML = '';

    games.forEach(function (game) {
      const isDone = game.id <= completed;
      const card = document.createElement('button');
      card.className = 'game-card' + (!game.available ? ' locked' : '') + (isDone ? ' done' : '');

      let statusHtml;
      if (!game.available) {
        statusHtml = '<span class="status locked">Coming Soon</span>';
      } else if (isDone) {
        statusHtml = '<span class="status done">Completed</span>';
      } else {
        statusHtml = '<span class="status ready">Play</span>';
      }

      card.innerHTML =
        '<div class="num">' + (isDone ? '✓' : game.id) + '</div>' +
        '<div class="game-body">' +
          '<div class="game-title">' + game.title + '</div>' +
          '<div class="game-sub">' + game.sub + '</div>' +
        '</div>' +
        statusHtml;

      if (game.available) {
        card.onclick = function () { window.location.href = game.href; };
      }

      list.appendChild(card);
    });
  }

  render();
  window.addEventListener('pageshow', render);
</script>

</body>
</html>
